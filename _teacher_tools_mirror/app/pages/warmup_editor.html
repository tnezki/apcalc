<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AP Calculus Warmup Builder</title>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]],processEscapes:true}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--navy:#173f6d;--navy2:#12365f;--gold:#e0bd4f;--gold2:#f7bb20;--ink:#1f2937;--muted:#64748b;--line:#d2dbe6;--panel:#f7f9fc;--bg:#dfe7f1;--paper:#fff;--pale:#fff5c9;--calc:#e8f2fb;--nocalc:#fff3cc}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);overflow:hidden}
.topbar{height:86px;background:var(--navy2);color:#fff;display:flex;align-items:center;padding:0 18px;gap:22px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.topbar h1{font-size:1.35rem;margin:0;font-weight:900}.topbar .crumb{opacity:.95;font-weight:850}.topbar .spacer{flex:1}.topbar a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:7px 10px;font-size:.78rem;font-weight:850}
.shell{display:grid;grid-template-columns:450px minmax(0,1fr);height:calc(100vh - 86px)}
.controls{background:#f8fafc;border-right:1px solid #c9d4e0;display:flex;flex-direction:column;min-width:0;overflow:hidden}.controls-scroll{padding:16px 14px 140px;overflow:auto}
.kicker{font-size:.73rem;letter-spacing:.10em;text-transform:uppercase;font-weight:900;color:#2671aa}.control-title{display:flex;align-items:center;gap:10px;margin:3px 0 14px}.control-title h2{margin:0;color:var(--navy);font-size:1.55rem}.pill{margin-left:auto;background:#e8f0f8;color:var(--navy);border-radius:999px;padding:5px 10px;font-size:.75rem;font-weight:900}
.label{font-size:.72rem;font-weight:900;text-transform:uppercase;color:#526170;letter-spacing:.04em;margin:14px 0 6px}.row{display:flex;gap:7px;align-items:center}.field,select,input,textarea{font:inherit}select,input[type=text],textarea{width:100%;border:1px solid #c4cfdb;border-radius:9px;background:#fff;color:#253447;padding:9px 10px}.btn{border:1px solid #b9c6d5;background:#fff;color:var(--navy);border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.btn:hover,.mini:hover{background:#eef4fa}.btn.gold{background:var(--gold2);border-color:#d69f08;color:var(--navy)}
.range-line{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;align-items:center}.range-line input[type=range]{width:100%;accent-color:var(--navy)}.out{min-width:52px;text-align:right;font-size:.76rem;font-weight:900;color:#3f5164}.mini{border:1px solid #c5d0dc;background:#fff;color:var(--navy);border-radius:8px;padding:6px 9px;font-weight:900;cursor:pointer}.step{width:62px;padding:6px 5px;border:1px solid #c5d0dc;border-radius:8px;background:#fff}
.status{margin:10px 0 12px;padding:9px 10px;border:1px solid #d5dde7;border-radius:8px;background:#f8fafc;color:#526170;font-size:.79rem}.status.good{background:#eef9f2;border-color:#b7ddc8;color:#16633e}.status.bad{background:#fff0f0;border-color:#e3b4b4;color:#9e3131}
.warmup-group{border-top:1px solid #dbe2ea;padding-top:12px;margin-top:13px}.warmup-head{display:flex;gap:7px;align-items:center;margin-bottom:8px}.warmup-head strong{color:var(--navy);font-size:.95rem}.warmup-head input{flex:1;border:1px solid #c7d1dd;border-radius:8px;padding:7px 8px}
.qcard{border:1px solid #d5dee8;border-radius:11px;background:#fff;margin:8px 0;padding:9px 10px}.qtop{display:flex;gap:7px;align-items:center}.qtop strong{color:var(--navy);font-size:.89rem}.qmeta{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}.qtop .spacer{flex:1}.icon{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid #ccd6e1;border-radius:8px;background:#fff;color:var(--navy);font-size:1rem;font-weight:900;cursor:pointer}.icon.off{color:#8a2d2d}
.quick{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}.quick select{padding:7px 8px}.editor{display:none;margin-top:9px;border-top:1px solid #e0e6ed;padding-top:9px}.qcard.editing .editor{display:block}.editor textarea{min-height:74px;font:13px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}.choices{display:grid;grid-template-columns:22px 1fr;gap:5px 7px;margin-top:7px}.choices span{color:var(--navy);font-weight:900;padding-top:7px}.choices input{border:1px solid #c7d1dd;border-radius:7px;padding:7px 8px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.edit-grid label{font-size:.69rem;color:#536476;font-weight:850}.edit-grid input,.edit-grid select{margin-top:3px;padding:7px 8px}.alt-row{display:flex;gap:7px;margin-top:8px}
.footer-actions{position:absolute;left:0;bottom:0;width:450px;background:#f8fafc;border-top:1px solid #cfd9e4;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px;z-index:10}.footer-actions .open{grid-column:1/-1;background:var(--navy);color:#fff;text-decoration:none;text-align:center;border-radius:9px;padding:13px 10px;font-weight:900}.footer-actions .btn{font-size:1rem;padding:12px 10px}
.preview-wrap{overflow:auto;padding:18px 24px 60px;background:#dfe7f1}.preview-head{font-size:.78rem;font-weight:900;color:#334456;margin:0 0 14px}.paper{width:8.5in;min-height:11in;margin:0 auto 20px;background:#fff;box-shadow:0 4px 18px rgba(17,38,61,.16);padding:.55in .62in}.doc-head{border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:10px}.doc-head .small{font-size:8.5pt;color:#67798c;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.doc-head h3{margin:3px 0 0;color:var(--navy);font-size:18pt}.intro-preview{font-size:9.5pt;color:#586a7d;line-height:1.35;margin:10px 0 14px}.warm-preview{border-top:1px solid #dce3ea;padding:11px 0 10px;break-inside:avoid}.warm-preview:first-of-type{border-top:0}.warm-preview h4{margin:0 0 7px;color:var(--navy);font-size:11pt}.warm-preview .date{font-size:8pt;color:#7b6517;font-weight:800;margin-left:6px}.pq{padding:6px 0}.pmeta{display:flex;gap:6px;align-items:center;margin-bottom:4px}.badge{font-size:7.5pt;font-weight:900;border-radius:999px;padding:3px 6px}.badge.calc{background:var(--calc);color:#245f91}.badge.nocalc{background:var(--nocalc);color:#725d18}.role{font-size:8pt;color:#667788;font-weight:800}.stem{font-size:10.5pt;line-height:1.35}.choices-preview{margin:6px 0 0 24px;padding-left:15px;font-size:10pt}.choices-preview li{padding:2px 0}.work{height:var(--work,.55in)}
@media(max-width:1050px){body{overflow:auto}.shell{display:block;height:auto}.controls{border-right:0}.controls-scroll{padding-bottom:20px}.footer-actions{position:static;width:auto}.preview-wrap{padding:16px 8px}.paper{width:100%;min-height:auto}.topbar{height:auto;min-height:72px;flex-wrap:wrap;padding:12px}.shell{height:auto}}
</style>
</head>
<body>
<header class="topbar"><h1>AP Calculus Tools</h1><div class="crumb">Warmup Builder</div><div class="spacer"></div><a href="/library/?type=warmups">Library</a><a href="/warmup_builder/">Generate Next Week</a><a href="/planner/">Planner</a><a href="/">Course Tools</a></header>
<div class="shell">
<aside class="controls">
  <div class="controls-scroll">
    <div class="kicker">CPM BUILDER CONTROLS</div>
    <div class="control-title"><h2>Warmups</h2><span id="count" class="pill">0 questions</span></div>
    <div class="label">Week</div><div class="row"><select id="week"></select><button id="reload" class="btn">Reload</button></div>
    <div id="status" class="status">Loading warmups…</div>
    <div class="label">Document title</div><input id="title" type="text">
    <div class="label">Student intro</div><textarea id="intro" rows="3"></textarea>
    <div class="label">Whole document question workspace</div>
    <div class="range-line"><input id="workspace" type="range" min="0" max="3" step="0.05"><span id="workspaceOut" class="out"></span><button id="wsMinus" class="mini">−</button><button id="wsPlus" class="mini">+</button></div>
    <div class="row" style="justify-content:flex-end;margin-top:5px"><span style="font-size:.68rem;color:#67788a;font-weight:800">Nudge</span><select id="wsStep" class="step"><option value="0.05">.05</option><option value="0.1">.10</option><option value="0.25">.25</option></select></div>
    <div id="warmups"></div>
  </div>
  <div class="footer-actions"><button id="save" class="btn">Save Draft</button><button id="publish" class="btn gold">Publish Student Page</button><a id="openStudent" class="open" target="_blank" rel="noopener">Open Student Page ↗</a></div>
</aside>
<main class="preview-wrap"><div class="preview-head">Student preview · answers are never stored on the student page</div><article id="paper" class="paper"></article></main>
</div>
<script>
const $=id=>document.getElementById(id);let cfg=null,weeks=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(m,k=''){const e=$('status');e.className='status'+(k?' '+k:'');e.textContent=m}
function activeInst(q){q.instances=q.instances?.length?q.instances:[{label:'Original',stem:'',choices:['','','','','']}];q.active_instance=Math.max(0,Math.min(Number(q.active_instance||0),q.instances.length-1));return q.instances[q.active_instance]}
function syncTop(){if(!cfg)return;cfg.title=$('title').value;cfg.intro=$('intro').value;cfg.settings=cfg.settings||{};cfg.settings.workspace=Number($('workspace').value||0)}
function fillTop(){const n=Number(cfg.week_number);$('title').value=cfg.title||'';$('intro').value=cfg.intro||'';$('workspace').value=cfg.settings?.workspace??0.55;$('workspaceOut').textContent=`${Number($('workspace').value).toFixed(2)} in`;$('openStudent').href=`https://tnezki.github.io/apcalc/warmups/week_${String(n).padStart(2,'0')}_warmups/week_${String(n).padStart(2,'0')}_warmups.html`}
function saveQuestionInputs(card,q){const a=activeInst(q);a.stem=card.querySelector('.stemEdit').value;a.choices=[...card.querySelectorAll('.choiceEdit')].map(x=>x.value);q.role=card.querySelector('.roleEdit').value;q.topic=card.querySelector('.topicEdit').value;q.calculator=card.querySelector('.calcEdit').value;q.visible=card.querySelector('.useEdit').checked}
function renderControls(){const host=$('warmups');host.innerHTML='';let qcount=0;(cfg.warmups||[]).forEach(w=>{const group=document.createElement('section');group.className='warmup-group';group.innerHTML=`<div class="warmup-head"><strong>Warmup ${esc(w.number)}</strong><input class="wlabel" value="${esc(w.label||'')}" placeholder="Date / timing label"></div><div class="qhost"></div>`;host.appendChild(group);group.querySelector('.wlabel').oninput=e=>{w.label=e.target.value;renderPreview()};const qhost=group.querySelector('.qhost');(w.questions||[]).forEach((q,qi)=>{qcount++;const inst=activeInst(q);const card=document.createElement('div');card.className='qcard';card.innerHTML=`<div class="qtop"><strong>Q${qi+1}</strong><span class="qmeta">${esc(q.role||'')} · ${esc(q.topic||'')}</span><div class="spacer"></div><button class="icon editBtn" title="Edit question">✎</button><button class="icon toggleBtn ${q.visible===false?'off':''}" title="Use / hide question">${q.visible===false?'○':'●'}</button></div><div class="quick"><select class="instsel">${q.instances.map((x,j)=>`<option value="${j}" ${j===q.active_instance?'selected':''}>${esc(x.label||`Instance ${j+1}`)}</option>`).join('')}</select><button class="mini addAlt">+ Alternate</button></div><div class="editor"><textarea class="stemEdit"></textarea><div class="choices">${['A','B','C','D','E'].map((L,i)=>`<span>${L}</span><input class="choiceEdit" data-i="${i}">`).join('')}</div><div class="edit-grid"><label>Purpose<select class="roleEdit"><option>Recent Review</option><option>Spiral Review</option></select></label><label>Calculator<select class="calcEdit"><option>No Calculator</option><option>Calculator Permitted</option></select></label><label style="grid-column:1/-1">Skill / topic<input class="topicEdit" type="text"></label></div><label style="display:block;margin-top:8px;font-size:.72rem;font-weight:850;color:#526170"><input class="useEdit" type="checkbox" ${q.visible!==false?'checked':''}> use on student page</label><div class="alt-row"><button class="mini duplicate">Duplicate as alternate</button></div></div>`;qhost.appendChild(card);card.querySelector('.stemEdit').value=inst.stem||'';card.querySelectorAll('.choiceEdit').forEach((el,i)=>el.value=inst.choices?.[i]||'');card.querySelector('.roleEdit').value=q.role||'Recent Review';card.querySelector('.topicEdit').value=q.topic||'';card.querySelector('.calcEdit').value=q.calculator||'No Calculator';const update=()=>{saveQuestionInputs(card,q);card.querySelector('.qmeta').textContent=`${q.role} · ${q.topic}`;card.querySelector('.toggleBtn').classList.toggle('off',q.visible===false);card.querySelector('.toggleBtn').textContent=q.visible===false?'○':'●';renderPreview()};card.querySelector('.editBtn').onclick=()=>card.classList.toggle('editing');card.querySelector('.toggleBtn').onclick=()=>{q.visible=!q.visible;card.querySelector('.useEdit').checked=q.visible;update()};card.querySelectorAll('.stemEdit,.choiceEdit,.topicEdit').forEach(el=>el.oninput=update);card.querySelectorAll('.roleEdit,.calcEdit,.useEdit').forEach(el=>el.onchange=update);card.querySelector('.instsel').onchange=e=>{saveQuestionInputs(card,q);q.active_instance=Number(e.target.value);renderControls();renderPreview()};function addAlternate(){saveQuestionInputs(card,q);const base=JSON.parse(JSON.stringify(activeInst(q)));base.label=`Alternate ${q.instances.length}`;q.instances.push(base);q.active_instance=q.instances.length-1;renderControls();renderPreview()}card.querySelector('.addAlt').onclick=addAlternate;card.querySelector('.duplicate').onclick=addAlternate});});$('count').textContent=`${qcount} questions`}
function renderPreview(){if(!cfg)return;syncTop();const paper=$('paper');const ws=Number(cfg.settings?.workspace??0.55);let body=`<header class="doc-head"><div class="small">AP Calculus AB · Retrieval + Skill Strengthening</div><h3>${esc(cfg.title||'Warmups')}</h3></header><div class="intro-preview">${esc(cfg.intro||'')}</div>`;(cfg.warmups||[]).forEach(w=>{body+=`<section class="warm-preview"><h4>Warmup ${esc(w.number)} <span class="date">${esc(w.label||'')}</span></h4>`;(w.questions||[]).forEach(q=>{if(q.visible===false)return;const a=activeInst(q);const cc=q.calculator==='Calculator Permitted'?'calc':'nocalc';body+=`<div class="pq"><div class="pmeta"><span class="badge ${cc}">${esc(q.calculator||'')}</span><span class="role">${esc(q.role||'')} · ${esc(q.topic||'')}</span></div><div class="stem">${esc(a.stem||'')}</div><ol class="choices-preview" type="A">${(a.choices||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ol><div class="work" style="--work:${ws}in"></div></div>`});body+=`</section>`});paper.innerHTML=body;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([paper]).catch(()=>{})}
async function loadWeeks(){const r=await fetch('/api/warmups/editor/weeks',{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||`HTTP ${r.status}`);weeks=j.weeks||[];const wanted=Number(new URLSearchParams(location.search).get('week')||0);$('week').innerHTML=weeks.map(w=>`<option value="${w.week_number}">Week ${w.week_number}${w.published?' · published':''}</option>`).join('');const pick=weeks.some(w=>w.week_number===wanted)?wanted:(weeks[0]?.week_number||0);$('week').value=String(pick);await loadWeek(pick)}
async function loadWeek(n){if(!n)return;status(`Loading Week ${n}…`);const r=await fetch(`/api/warmups/editor/week?week=${n}`,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||`HTTP ${r.status}`);cfg=j.config;fillTop();renderControls();renderPreview();history.replaceState(null,'',`?week=${n}`);status(`Week ${n} loaded. Fine tune here; the student URL stays clean.`,'good')}
async function send(path){syncTop();status(path.includes('publish')?'Publishing student page…':'Saving local draft…');const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:cfg})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||`HTTP ${r.status}`);cfg=j.config||cfg;fillTop();renderControls();renderPreview();status(j.message||'Saved.','good')}
function nudgeWorkspace(delta){const cur=Number($('workspace').value||0),next=Math.max(0,Math.min(3,cur+delta));$('workspace').value=next.toFixed(2);$('workspaceOut').textContent=`${next.toFixed(2)} in`;renderPreview()}
$('week').onchange=()=>loadWeek(Number($('week').value)).catch(e=>status(e.message,'bad'));$('reload').onclick=()=>loadWeek(Number($('week').value)).catch(e=>status(e.message,'bad'));$('save').onclick=()=>send('/api/warmups/editor/save').catch(e=>status(e.message,'bad'));$('publish').onclick=()=>send('/api/warmups/editor/publish').catch(e=>status(e.message,'bad'));$('title').oninput=renderPreview;$('intro').oninput=renderPreview;$('workspace').oninput=()=>{$('workspaceOut').textContent=`${Number($('workspace').value).toFixed(2)} in`;renderPreview()};$('wsMinus').onclick=()=>nudgeWorkspace(-Number($('wsStep').value));$('wsPlus').onclick=()=>nudgeWorkspace(Number($('wsStep').value));loadWeeks().catch(e=>status(e.message,'bad'));
</script>
</body></html>
